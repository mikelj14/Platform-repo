services:
  jenkins:
    build: .
    container_name: jenkins
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    # Overrides the container's group ID for the Docker socket to match the host
    group_add:
      - "0" 
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/New_York

volumes:
  jenkins_home:
